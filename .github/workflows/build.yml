name: build-tinc
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载 zig 编译器 (官方CDN, 替代 musl.cc)
        run: |
          mkdir -p /tmp/prefix/lib /tmp/prefix/include
          curl -fL --retry 5 -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            || python3 -c "
import json,urllib.request
d=json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))
print(d['0.16.0']['x86_64-linux']['tarball'])" | xargs curl -fL --retry 5 -o /tmp/zig.tar.xz
          tar xJf /tmp/zig.tar.xz -C /tmp
          ZIG=$(ls -d /tmp/zig-* | head -1)
          echo "ZIG=$ZIG" >> $GITHUB_ENV
          $ZIG/zig version
          printf '#!/bin/bash\nexec %s cc -target aarch64-linux-musl "$@"\n' "$ZIG/zig" > /tmp/zig-cc.sh
          chmod +x /tmp/zig-cc.sh
      - name: 下载源码 (tinc 1.0.36 + zlib + openssl)
        run: |
          cd /tmp
          curl -fL --retry 5 -o tinc.tgz https://deb.debian.org/debian/pool/main/t/tinc/tinc_1.0.36.orig.tar.gz
          curl -fL --retry 5 -o zlib.tgz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          curl -fL --retry 5 -o openssl.tgz https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1w.tar.gz
          tar xzf tinc.tgz && tar xzf zlib.tgz && tar xzf openssl.tgz
      - name: 交叉编译 zlib 静态库
        run: |
          cd /tmp/zlib-1.3.1
          CHOST=aarch64-linux-musl CC=/tmp/zig-cc.sh AR=/usr/bin/ar RANLIB=/usr/bin/ranlib \
          ./configure --static --prefix=/tmp/prefix
          make -j$(nproc) libz.a AR=/usr/bin/ar RANLIB=/usr/bin/ranlib
          make install
      - name: 交叉编译 OpenSSL 1.1.1w 静态库
        run: |
          cd /tmp/openssl-OpenSSL_1_1_1w
          CC=/tmp/zig-cc.sh ./Configure linux-aarch64 no-shared no-tests no-asm \
            --prefix=/tmp/prefix --openssldir=/tmp/prefix/ssl
          make -j$(nproc) build_libs AR=/usr/bin/ar RANLIB=/usr/bin/ranlib
          cp libcrypto.a libssl.a /tmp/prefix/lib/
          cp -r include/openssl /tmp/prefix/include/
      - name: 交叉编译 tinc 纯静态二进制
        run: |
          cd /tmp/tinc-1.0.36
          CC=/tmp/zig-cc.sh ./configure --host=aarch64-linux-musl --prefix=/usr --sysconfdir=/etc/tinc \
            --with-zlib=/tmp/prefix --with-openssl=/tmp/prefix --disable-lzo \
            --disable-dependency-tracking --disable-hardening \
            CPPFLAGS="-I/tmp/prefix/include" LDFLAGS="-L/tmp/prefix/lib -static" CFLAGS="-O3"
          make -j$(nproc) AR=/usr/bin/ar RANLIB=/usr/bin/ranlib
      - name: 验证产物
        run: |
          file /tmp/tinc-1.0.36/src/tinc
          sha256sum /tmp/tinc-1.0.36/src/tinc
          if file /tmp/tinc-1.0.36/src/tinc | grep -q "statically linked"; then
            echo "验证成功：此二进制文件为纯静态链接！"
          else
            echo "警告：可能未能实现完全静态链接！" && exit 1
          fi
      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: tinc-aarch64
          path: /tmp/tinc-1.0.36/src/tinc
          if-no-files-found: error
