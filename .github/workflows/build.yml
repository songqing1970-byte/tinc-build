name: build-tinc

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 APT 交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu make
          mkdir -p /tmp/prefix/lib /tmp/prefix/include

      - name: 下载源码 (tinc 1.0.36 + zlib + openssl)
        run: |
          cd /tmp
          curl -fL -o tinc.tgz https://deb.debian.org/debian/pool/main/t/tinc/tinc_1.0.36.orig.tar.gz
          curl -fL -o zlib.tgz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          curl -fL -o openssl.tgz https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1w.tar.gz
          tar xzf tinc.tgz && tar xzf zlib.tgz && tar xzf openssl.tgz

      - name: 交叉编译 zlib 静态库
        run: |
          cd /tmp/zlib-1.3.1
          CC=aarch64-linux-gnu-gcc \
          AR=aarch64-linux-gnu-ar \
          RANLIB=aarch64-linux-gnu-ranlib \
          ./configure --static --prefix=/tmp/prefix
          make -j$(nproc) && make install

      - name: 交叉编译 OpenSSL 1.1.1w 静态库
        run: |
          cd /tmp/openssl-OpenSSL_1_1_1w
          ./Configure linux-aarch64 no-shared no-tests no-asm \
            --prefix=/tmp/prefix --openssldir=/tmp/prefix/ssl \
            --cross-compile-prefix=aarch64-linux-gnu-
          make -j$(nproc) build_libs
          cp libcrypto.a libssl.a /tmp/prefix/lib/
          cp -r include/openssl /tmp/prefix/include/

      - name: 交叉编译 tinc 纯静态二进制
        run: |
          cd /tmp/tinc-1.0.36
          ./configure --host=aarch64-linux-gnu --prefix=/usr --sysconfdir=/etc/tinc \
            --with-zlib=/tmp/prefix --with-openssl=/tmp/prefix --disable-lzo \
            CPPFLAGS="-I/tmp/prefix/include" LDFLAGS="-L/tmp/prefix/lib -static" \
            CC=aarch64-linux-gnu-gcc CFLAGS="-O2"
          make -j$(nproc)

      - name: 验证产物
        run: |
          file /tmp/tinc-1.0.36/src/tinc
          sha256sum /tmp/tinc-1.0.36/src/tinc
          if file /tmp/tinc-1.0.36/src/tinc | grep -q "statically linked"; then
            echo "验证成功：此二进制文件为纯静态链接！"
          else
            echo "警告：未能实现完全静态链接！" && exit 1
          fi

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: tinc-aarch64
          path: /tmp/tinc-1.0.36/src/tinc
          if-no-files-found: error
